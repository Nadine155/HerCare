<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Remix  HerCare</title>
    <meta name="description" content="A calm well-being companion and safe sanctuary designed with care for students and graduates in Tunisia." />
    <meta property="og:title" content="Remix  HerCare" />
    <meta property="og:description" content="A calm well-being companion and safe sanctuary designed with care for students and graduates in Tunisia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hercare_user_state');
          if (saved) {
            var state = JSON.parse(saved);
            var palettes = {
              lavender: { primary: '#684fa7', bg: '#f8f4fe', sec: '#6c5696', secFixed: '#efe5ff' },
              pink: { primary: '#c92a6b', bg: '#fff0f5', sec: '#ad3368', secFixed: '#ffedf4' },
              blue: { primary: '#1d63d6', bg: '#eff6ff', sec: '#2563eb', secFixed: '#e0f2fe' },
              mint: { primary: '#0d8a5b', bg: '#f0fdf4', sec: '#167a57', secFixed: '#dcfce7' },
              peach: { primary: '#d44e1c', bg: '#fff4ec', sec: '#c24617', secFixed: '#ffedd5' },
              yellow: { primary: '#b47806', bg: '#fefce8', sec: '#9a6405', secFixed: '#fef9c3' }
            };
            var p = palettes[state.paletteTheme] || palettes.lavender;
            var r = document.documentElement;
            r.style.setProperty('--theme-primary', p.primary);
            r.style.setProperty('--color-primary', p.primary);
            r.style.setProperty('--theme-bg', p.bg);
            r.style.setProperty('--color-background', p.bg);
            r.style.setProperty('--theme-surface', p.bg);
            r.style.setProperty('--color-surface', p.bg);
            r.style.setProperty('--theme-secondary', p.sec);
            r.style.setProperty('--color-secondary', p.sec);
            r.style.setProperty('--theme-secondary-fixed', p.secFixed);
            r.style.setProperty('--color-secondary-fixed', p.secFixed);
            r.style.backgroundColor = p.bg;
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
